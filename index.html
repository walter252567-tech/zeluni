class PostManager {
  parseTags(s) { return [...new Set(String(s || "").split(/[,\n#]+/).map(t => clean(t, 32).toLowerCase()).filter(Boolean))].slice(0, 15); }
  async publishTask(task, meta, { postId = "" } = {}) {
    const rec = task.rec, me = App.auth.user; if (!me) throw new Error("Create a profile before publishing");
    if (rec.publishedItemId && App.manifest.items.has(rec.publishedItemId)) return App.manifest.items.get(rec.publishedItemId);
    if (task.publishing) throw new Error("Publish already in progress");
    if (task.state !== S.READY) throw new Error("This upload is not ready yet");
    if (!task.settled) throw new Error("Generated files are still uploading — try again in a moment");
    task.publishing = true;
    try {
      const kids = {}; for (const c of rec.children || []) { const t = App.uploads.tasks.get(c.id); if (t?.state === S.READY && t.rec.driveFileId) kids[c.role] = t.rec; }
      const p = rec.processing || {}, id = uid(rec.kind), now = new Date().toISOString();
      const item = {
        id, ownerId: me.id, type: rec.kind, title: clean(meta.title, 150) || rec.filename.replace(/\.[^.]+$/, ""), description: clean(meta.description, 5000), tags: this.parseTags(meta.tags), category: clean(meta.category, 40) || "General",
        filename: rec.filename, mimeType: rec.mime, originalSize: rec.size, playbackSize: kids.playback?.size || p.playbackSize || 0, width: rec.meta?.width || p.width || 0, height: rec.meta?.height || p.height || 0, duration: rec.meta?.duration || p.duration || 0,
        thumbnailFileId: kids.thumbnail?.driveFileId || kids.image_thumb?.driveFileId || p.thumbnailFileId || "", originalFileId: rec.driveFileId, playbackFileId: kids.playback?.driveFileId || p.playbackFileId || "", driveFileId: rec.driveFileId,
        imageFileIds: { large: kids.image_large?.driveFileId || "", medium: kids.image_medium?.driveFileId || "", thumbnail: kids.image_thumb?.driveFileId || "" },
        variants: Array.isArray(p.variants) ? p.variants : [], urls: {}, visibility: VIS.includes(meta.visibility) ? meta.visibility : "public", downloadEnabled: !!meta.downloadEnabled, ageRestricted: meta.ageRestricted !== false,
        processingStatus: rec.compression?.status === "serverTranscodeRequired" ? "serverTranscodeRequired" : (p.state || "READY"), moderationStatus: MOD.PENDING, moderation: { notes: [], appeals: [] },
        createdAt: new Date(rec.created).toISOString(), publishedAt: now, storage: { [MODE.LOCAL]: "local", [MODE.DRIVE]: "drive", [MODE.CENTRAL]: "central" }[App.mode], postId, checksum: rec.fingerprint?.value || "", stats: { views: 0, likes: 0 }
      };
      if (p.playbackUrl) item.urls.playback = p.playbackUrl; if (p.thumbnailUrl) item.urls.thumbnail = p.thumbnailUrl; if (rec.result?.mediaUrl) item.urls.original = rec.result.mediaUrl;
      task.set(S.PUBLISHING, { error: "" });
      const res = await App.storage.publishItem(item);
      const srv = Model.item({ ...item, ...(res.item || {}), id, ownerId: me.id }) || Model.item(item);
      if (App.mode === MODE.LOCAL && CFG.localAutoApprove) { srv.moderationStatus = MOD.APPROVED; srv.moderation.notes.push({ at: now, by: "local-development", text: "Auto-approved because this device is its own moderator" }); }
      await db.put("items", srv); App.manifest.items.set(srv.id, srv);
      rec.publishedItemId = id; task.set(S.PUBLISHED, { error: "" });
      for (const c of rec.children || []) { await db.del("blobs", "derived:" + c.id).catch(() => {}); await db.del("uploads", c.id).catch(() => {}); }
      await db.del("blobs", "handle:" + rec.id).catch(() => {}); await db.del("uploads", rec.id).catch(() => {});
      Bus.emit("manifest"); return srv;
    } catch (e) { task.set(S.READY, { error: "Publish failed: " + e.message }); throw e; }
    finally { task.publishing = false; }
  }
  async publishPost({ body, tasks, visibility }) {
    const me = App.auth.user; if (!me) throw new Error("Create a profile before publishing");
    body = clean(body, 10000); if (!body && !tasks.length) throw new Error("Write something or attach media first");
    const id = uid("post"), items = [];
    for (const t of tasks) items.push(await this.publishTask(t, { title: t.rec.filename.replace(/\.[^.]+$/, ""), description: "", tags: "", category: "General", visibility, downloadEnabled: true }, { postId: id }));
    const kinds = new Set(items.map(i => i.type)); const now = new Date().toISOString();
    const post = { id, authorId: me.id, body, assets: items.map(i => i.id), type: !items.length ? "TEXT" : kinds.size > 1 ? "MIXED" : items[0].type === "image" ? "IMAGE" : "VIDEO", visibility: VIS.includes(visibility) ? visibility : "public", moderationStatus: MOD.PENDING, createdAt: now, updatedAt: now, storage: { [MODE.LOCAL]: "local", [MODE.DRIVE]: "drive", [MODE.CENTRAL]: "central" }[App.mode] };
    const res = await App.storage.publishPost(post);
    const fin = Model.post({ ...post, ...(res.post || {}), id, authorId: me.id });
    if (App.mode === MODE.LOCAL && CFG.localAutoApprove) fin.moderationStatus = MOD.APPROVED;
    await db.put("posts", fin); App.manifest.posts.set(fin.id, fin);
    for (const it of items) if (App.mode === MODE.LOCAL && CFG.localAutoApprove && it.moderationStatus !== MOD.APPROVED) { it.moderationStatus = MOD.APPROVED; await db.put("items", it); }
    Bus.emit("manifest"); return fin;
  }
}

class FeedManager {
  constructor() { this.seed = Math.random(); this.aff = null; Bus.on("history", () => { this.aff = null; }); }
  async affinity() {
    if (this.aff) return this.aff; const tags = new Map(), creators = new Map(), cats = new Map(), now = Date.now();
    for (const h of await db.all("history")) { const w = (0.3 + h.pct) * Math.pow(0.5, (now - h.ts) / (7 * 864e5)); for (const t of h.tags || []) tags.set(t, (tags.get(t) || 0) + w); creators.set(h.ownerId, (creators.get(h.ownerId) || 0) + w); cats.set(h.category, (cats.get(h.category) || 0) + w); }
    for (const k of App.manifest.likeKeys) { const i = App.manifest.items.get(k.split(":")[1]); if (i) { for (const t of i.tags) tags.set(t, (tags.get(t) || 0) + 1); creators.set(i.ownerId, (creators.get(i.ownerId) || 0) + 1); } }
    const norm = m => { const mx = Math.max(1, ...m.values()); for (const [k, v] of m) m.set(k, v / mx); return m; };
    return (this.aff = { tags: norm(tags), creators: norm(creators), cats: norm(cats) });
  }
  base() {
    const m = App.manifest, out = [];
    for (const i of m.items.values()) if (!i.postId && m.listed(i)) out.push({ kind: "item", obj: i, ts: Date.parse(i.publishedAt) || 0 });
    for (const p of m.posts.values()) if (m.postListed(p)) out.push({ kind: "post", obj: p, ts: Date.parse(p.createdAt) || 0 });
    return out;
  }
  newest() { return this.base().sort((a, b) => b.ts - a.ts); }
  trending() {
    const m = App.manifest, now = Date.now();
    const sc = e => { if (e.kind !== "item") return 0; const i = e.obj, s = m.stats.get(i.id) || {}; const hrs = Math.max(0, (now - e.ts) / 36e5); return (m.views(i) + 3 * m.likes(i) + 2 * (s.completions || 0)) / Math.pow(hrs + 4, 1.2); };
    return this.base().map(e => [e, sc(e)]).sort((a, b) => b[1] - a[1] || b[0].ts - a[0].ts).map(x => x[0]);
  }
  following() { const me = App.auth.user?.id; if (!me) return []; return this.newest().filter(e => App.manifest.isFollowing(e.kind === "item" ? e.obj.ownerId : e.obj.authorId)); }
  async forYou() {
    const aff = await this.affinity(), m = App.manifest, now = Date.now(), rnd = id => { let h = Math.floor(this.seed * 1e9); for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 1000000007; return (h % 1000) / 1000; };
    const scored = this.base().map(e => {
      const o = e.obj, owner = e.kind === "item" ? o.ownerId : o.authorId, tags = e.kind === "item" ? o.tags : [];
      const rel = tags.length ? Math.min(1, tags.reduce((a, t) => a + (aff.tags.get(t) || 0), 0) / Math.sqrt(tags.length)) : 0;
      const creator = Math.min(1, (aff.creators.get(owner) || 0) + (m.isFollowing(owner) ? 0.5 : 0));
      const watch = Math.min(1, 0.6 * rel + 0.6 * creator + 0.2 * (e.kind === "item" ? aff.cats.get(o.category) || 0 : 0));
      const st = e.kind === "item" ? m.stats.get(o.id) : null; const completion = st?.views ? Math.min(1, (st.completions || 0) / st.views) : 0.5;

      { id: "oauth", name: "OAuth (Google)", run: async () => { if (!CFG.googleClientId) return NC("Google OAuth client ID is not configured"); const g = App.auth.google; await g.loadGis(); if (!g.connected) await g.connect(); return P(`Authorized; token valid ~${Math.max(0, Math.round((g.expiresAt - Date.now()) / 60000))} min`); } },
      { id: "drive", name: "Drive API", run: async () => { if (!CFG.googleClientId) return NC("Google OAuth client ID is not configured"); const a = await drive().api("about", { params: { fields: "user(displayName),storageQuota(limit,usage)" } }); const q = a.storageQuota || {}; return P(`Drive API reachable${q.usage ? "; used " + fmtBytes(+q.usage) + (q.limit ? " of " + fmtBytes(+q.limit) : "") : ""}`); } },
      { id: "folder", name: "Drive folder permission", run: async () => { if (!CFG.googleClientId) return NC("Google OAuth client ID is not configured"); if (!CFG.googleDriveFolderId) return NC("Drive folder ID is not configured"); try { const f = await drive().api(`files/${encodeURIComponent(CFG.googleDriveFolderId)}`, { params: { fields: "id,name,mimeType,capabilities(canAddChildren)", supportsAllDrives: "true" } }); if (f.mimeType !== "application/vnd.google-apps.folder") return { status: "FAIL", detail: "ID is not a folder" }; return f.capabilities?.canAddChildren ? P(`Can write into "${f.name}"`) : { status: "FAIL", detail: `Folder "${f.name}" is read-only for this account` }; } catch (e) { return { status: "FAIL", detail: e.message + (e.code === "NOT_FOUND" ? " — with the narrow drive.file scope the app cannot see folders it did not create; use the drive scope or a backend" : "") }; } } },
      { id: "upload", name: "Small upload", run: async () => { const n = needStorage(); if (n) return n; const r = await upload(300 * 1024); return P(`Uploaded ${fmtBytes(300 * 1024)}, verified; ${r.cleaned}`); } },
