<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeluni</title>
<meta name="description" content="Zeluni is a user-generated media platform for video, photos and posts.">
<meta name="theme-color" content="#0f1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ffa62b'/%3E%3Cstop offset='.55' stop-color='%23f2606b'/%3E%3Cstop offset='1' stop-color='%237b4ce0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M4 34 24 8h42L44 34zM60 22q14 2 6 18L18 82q-12-4-6-16zM26 94l24-24h42L66 94z' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
/* ========================= STYLES ========================= */
:root{--bg:#0f1013;--bg2:#16171b;--bg3:#1e2025;--bg4:#282b32;--line:#2b2e36;--tx:#f4f5f7;--mu:#a3a8b3;--acc:#ff8a2a;--acc2:#f2606b;--acc3:#7b4ce0;--grad:linear-gradient(135deg,#ffa62b 0%,#f2606b 55%,#7b4ce0 100%);--ok:#3ddc97;--warn:#ffc247;--err:#ff6b78;--r:12px;--side:236px;--top:56px;--bot:60px;--ease:cubic-bezier(.2,.7,.2,1);--dur:180ms}
*{box-sizing:border-box}
html{color-scheme:dark;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
img,video{max-width:100%;display:block}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:1.6rem}h2{font-size:1.25rem}h3{font-size:1rem}
p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.skip{position:absolute;left:-999px;top:8px;background:var(--acc);color:#111;padding:8px 12px;border-radius:8px;z-index:200}
.skip:focus{left:8px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:16px;height:16px}.ic.lg{width:32px;height:32px}
.ic.fill{fill:currentColor;stroke:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mu{color:var(--mu)}.sm{font-size:.85rem}.xs{font-size:.76rem}.ok{color:var(--ok)}.err{color:var(--err)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:10px}.col{display:flex;flex-direction:column;gap:10px}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.between{justify-content:space-between}.center{text-align:center}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* top bar */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);z-index:50;display:flex;align-items:center;gap:12px;padding:0 12px;background:rgba(15,16,19,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:1.05rem}
.logo svg,.logo img{height:30px;width:auto}
.logo:hover{text-decoration:none}
.search{flex:1;max-width:560px;margin:0 auto;display:none;position:relative}
.search input{width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);padding:0 40px 0 16px;outline:none}
.search input:focus{border-color:var(--acc)}
.search button{position:absolute;right:4px;top:4px;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:var(--mu)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.78rem;background:var(--bg3);border:1px solid var(--line);color:var(--mu)}
.chip.bad{color:var(--err);border-color:var(--err)}.chip.good{color:var(--ok);border-color:#1f6b4b}.chip.warnc{color:var(--warn);border-color:#6b5320}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;position:relative;transition:background var(--dur) var(--ease),transform 100ms}
.iconbtn:hover{background:var(--bg3)}.iconbtn:active{transform:scale(.96)}
.badge{position:absolute;top:4px;right:3px;min-width:16px;height:16px;border-radius:8px;background:var(--acc2);font-size:.65rem;display:grid;place-items:center;padding:0 4px;color:#fff}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;background:var(--bg4);border:1px solid var(--line);font-weight:600;transition:transform 100ms var(--ease),background var(--dur) var(--ease),opacity var(--dur);white-space:nowrap}
.btn:hover{background:#31353d;text-decoration:none}.btn:active{transform:scale(.98)}
.btn.pri{background:var(--grad);border:0;color:#14110e}.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}.btn.sm{min-height:32px;padding:0 12px;font-size:.85rem}
.btn.danger{color:var(--err)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
/* layout */
#layout{padding-top:var(--top)}
.side{display:none;position:fixed;top:var(--top);left:0;bottom:0;width:var(--side);padding:12px 8px;border-right:1px solid var(--line);background:var(--bg);overflow-y:auto;z-index:20}
.side a{display:flex;align-items:center;gap:14px;height:44px;padding:0 14px;border-radius:10px;font-weight:500;color:var(--mu);transition:background var(--dur) var(--ease)}
.side a:hover{background:var(--bg3);text-decoration:none;color:var(--tx)}
.side a[aria-current=page]{background:var(--bg3);color:var(--tx)}
.side a[aria-current=page] .ic{stroke:var(--acc)}
.side hr{border:0;border-top:1px solid var(--line);margin:10px 0}
main{padding:14px 12px calc(var(--bot) + 40px);max-width:1560px;margin:0 auto;outline:none;min-height:70vh}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;height:calc(var(--bot) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg2);border-top:1px solid var(--line)}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;color:var(--mu);position:relative;min-height:48px}
.bottom a:hover{text-decoration:none}
.bottom a[aria-current=page]{color:var(--tx)}.bottom a[aria-current=page] .ic{stroke:var(--acc)}
.bottom .create{color:#14110e}
.bottom .create span.plus{width:44px;height:32px;border-radius:12px;background:var(--grad);display:grid;place-items:center}
@media(min-width:700px){.search{display:block}.mobsearch{display:none}}
@media(min-width:1024px){.side{display:block}.bottom{display:none}.mainwrap{margin-left:var(--side)}main{padding:24px 28px 60px}.topbar{padding:0 20px}}
/* grid + cards */
.grid{display:grid;grid-template-columns:1fr;gap:20px 16px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}}
.card{display:flex;flex-direction:column;gap:10px;transition:transform var(--dur) var(--ease)}
@media(hover:hover){.card:hover{transform:scale(1.015)}}
.thumb{position:relative;display:block;aspect-ratio:16/9;background:var(--bg3);border-radius:var(--r);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 250ms var(--ease)}
.thumb img.on{opacity:1}
.thumb .ph{position:absolute;inset:0;display:grid;place-items:center;color:#4a4e59}
.thumb .dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.78);border-radius:6px;padding:1px 6px;font-size:.75rem;font-weight:600}
.thumb .tag{position:absolute;left:8px;top:8px}
.card .meta{display:flex;gap:10px}
.card h3{font-size:.98rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);flex:none;overflow:hidden;display:grid;place-items:center;font-weight:800;color:#14110e;font-size:.9rem;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.av.lg{width:96px;height:96px;font-size:2rem;border:4px solid var(--bg)}
.av.md{width:48px;height:48px}
.postcard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.postmedia{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
.postmedia .thumb{aspect-ratio:1}
.badge-t{display:inline-block;border-radius:6px;padding:1px 7px;font-size:.7rem;font-weight:700;background:rgba(0,0,0,.7);letter-spacing:.04em}
.badge-t.pend{background:#5b4210;color:var(--warn)}.badge-t.rej{background:#5b1d24;color:var(--err)}
/* tabs, forms */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:10px 16px;color:var(--mu);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;transition:color var(--dur)}
.tabs button[aria-selected=true]{color:var(--tx);border-color:var(--acc)}
.tabpanel{animation:fadein 200ms var(--ease)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--mu)}
input[type=text],input[type=url],input[type=number],input[type=search],textarea,select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none;transition:border-color var(--dur)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.fgrid.two{grid-template-columns:1fr 1fr}}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.note{border-radius:10px;padding:10px 14px;font-size:.88rem;background:var(--bg3);border:1px solid var(--line)}
.note.warn{border-color:#6b5320;background:#231d0f;color:#f3d894}.note.bad{border-color:#6b2830;background:#241216;color:#ffb3bb}.note.info{border-color:#2b3f6b;background:#111a2b;color:#b9cdf5}
.hero{display:grid;place-items:center;text-align:center;gap:16px;padding:8vh 12px}
.hero .logo svg,.hero .logo img{height:64px}
/* upload */
.drop{border:2px dashed var(--line);border-radius:16px;padding:34px 16px;text-align:center;background:var(--bg2);transition:border-color var(--dur),background var(--dur)}
.drop.over{border-color:var(--acc);background:#1d1a16}
.ucard{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;animation:rise 200ms var(--ease)}
.ucard .top{display:flex;gap:12px}
.ucard .pv{width:112px;aspect-ratio:16/9;border-radius:8px;background:var(--bg3);overflow:hidden;flex:none;display:grid;place-items:center;color:#4a4e59}
.ucard .pv img{width:100%;height:100%;object-fit:cover}
.bar{height:6px;border-radius:3px;background:var(--bg4);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--grad);transition:width 200ms linear}
.state{font-size:.72rem;font-weight:700;letter-spacing:.05em;padding:2px 8px;border-radius:6px;background:var(--bg4)}
.state.s-UPLOADING,.state.s-PROCESSING,.state.s-COMPRESSING,.state.s-PREPARING,.state.s-VERIFYING{color:var(--acc)}
.state.s-READY,.state.s-PUBLISHED{color:var(--ok)}.state.s-FAILED,.state.s-REJECTED{color:var(--err)}
.state.s-PAUSED,.state.s-RECONNECTING,.state.s-CANCELLED{color:var(--warn)}
#upl-pill{position:fixed;right:12px;bottom:calc(var(--bot) + 14px + env(safe-area-inset-bottom));z-index:45;display:none;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--bg3);border:1px solid var(--acc);box-shadow:0 6px 24px rgba(0,0,0,.45);font-weight:600}
#upl-pill.on{display:flex;animation:rise 200ms var(--ease)}
@media(min-width:1024px){#upl-pill{bottom:20px;right:20px}}
#drawer{position:fixed;right:12px;left:12px;bottom:calc(var(--bot) + 70px + env(safe-area-inset-bottom));max-height:60vh;overflow:auto;z-index:46;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:12px;display:none;box-shadow:0 12px 40px rgba(0,0,0,.55)}
#drawer.on{display:block;animation:rise 200ms var(--ease)}
@media(min-width:700px){#drawer{left:auto;width:420px}}
@media(min-width:1024px){#drawer{bottom:76px}}
.drow{padding:8px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}.drow:last-child{border:0}
/* profile */
.cover{height:150px;border-radius:var(--r);background:var(--bg3);overflow:hidden;position:relative}
.cover img{width:100%;height:100%;object-fit:cover}
@media(min-width:700px){.cover{height:220px}}
.phead{display:flex;gap:16px;align-items:flex-end;margin:-40px 16px 12px;flex-wrap:wrap}
/* watch page */
.watch{display:grid;gap:20px}
@media(min-width:1100px){.watch{grid-template-columns:minmax(0,1fr) 380px}}
.zp{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9;user-select:none}
.zp video{width:100%;height:100%;background:#000;object-fit:contain}
.zp .poster{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.zp .ctl{position:absolute;left:0;right:0;bottom:0;padding:24px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.82));display:flex;flex-direction:column;gap:4px;transition:opacity 200ms var(--ease)}
.zp.idle .ctl{opacity:0;pointer-events:none}.zp.idle{cursor:none}
.zp .cr{display:flex;align-items:center;gap:2px}
.zp .cr .iconbtn{width:38px;height:38px;color:#fff}
.zp input[type=range]{accent-color:var(--acc);width:100%;height:18px;background:none;border:0;padding:0}
.zp .vol{width:70px}
.zp .tm{font-size:.8rem;margin:0 8px;font-variant-numeric:tabular-nums}
.zp .center{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.zp .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.25);border-top-color:var(--acc);animation:spin 800ms linear infinite;display:none}
.zp.buf .spin{display:block}
.zp .msg{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:20px;background:rgba(0,0,0,.8);gap:12px;align-content:center;z-index:3}
.zp.fail .msg{display:grid}
.pop{position:absolute;bottom:52px;right:8px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:140px;z-index:5;animation:rise 150ms var(--ease)}
.pop button{display:block;width:100%;text-align:left;padding:8px 12px;border-radius:6px;font-size:.88rem}
.pop button:hover,.pop button[aria-checked=true]{background:var(--bg4)}
.menu{position:absolute;z-index:60;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:rise 150ms var(--ease)}
.menu button{display:flex;width:100%;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:6px}
.menu button:hover{background:var(--bg4)}
.tagl{display:inline-block;border-radius:999px;background:var(--bg3);border:1px solid var(--line);padding:2px 12px;font-size:.82rem;margin:0 6px 6px 0}
.tagl:hover{border-color:var(--acc);text-decoration:none}
/* modal, toasts */
#modal{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(0,0,0,.66);padding:12px}
#modal.on{display:grid;animation:fadein 160ms var(--ease)}
.dlg{width:min(560px,100%);max-height:92vh;overflow:auto;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;animation:rise 200ms var(--ease)}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--bot) + 16px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
@media(min-width:1024px){#toasts{bottom:24px}}
.toast{pointer-events:auto;width:100%;background:var(--bg3);border:1px solid var(--line);border-left:4px solid var(--acc);padding:10px 14px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:rise 200ms var(--ease)}
.toast.err{border-left-color:var(--err)}.toast.ok{border-left-color:var(--ok)}
.sk{background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite;border-radius:var(--r)}
.test{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.pill{font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:6px;min-width:112px;text-align:center}
.pill.PASS{background:#123826;color:var(--ok)}.pill.FAIL{background:#3a161b;color:var(--err)}.pill.NC{background:#3a2f12;color:var(--warn)}.pill.RUN,.pill.NR{background:var(--bg4);color:var(--mu)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}table.t td,table.t th{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes shimmer{to{background-position:-200% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="zg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffa62b"/><stop offset=".55" stop-color="#f2606b"/><stop offset="1" stop-color="#7b4ce0"/></linearGradient>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M16.2 7.8l-2.1 6.3-6.3 2.1 2.1-6.3z"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="4"/><path d="M2 21v-1a6 6 0 0 1 12 0v1M16 4a4 4 0 0 1 0 8M22 21v-1a6 6 0 0 0-4-5.6"/></symbol>

<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></symbol>

<symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M7 4h3v16H7zM14 4h3v16h-3z"/></symbol>
<symbol id="i-vol" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
<symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4zM22 9l-6 6M16 9l6 6"/></symbol>
<symbol id="i-full" viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></symbol>
<symbol id="i-pip" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="12" width="8" height="6" rx="1"/></symbol>

<script>
"use strict";
/* =====================================================================
   ZELUNI — single-file user-generated media platform
   =====================================================================
   BACKEND CONTRACT (CentralUploadEndpointStorage). Base = centralUploadEndpoint.
   All JSON unless noted. Auth: "Authorization: Bearer <Google access token>" when the
   user connected Google, plus "X-Zeluni-User: <local profile id>". The endpoint MUST
   validate identity, ownership, size, MIME, rate limits and moderation server-side.

   POST /upload/init            {uploadId, role, filename, size, mime, checksum, kind, groupId}
                                -> {uploadSessionId, offset?, chunkSize?}
   POST /upload/chunk           headers: X-Upload-Id, Content-Range: bytes S-E/TOTAL; body: raw bytes
                                -> {offset, done?, result?}
   POST /upload/complete        {uploadSessionId, uploadId}
                                -> {driveFileId, size, mediaUrl?, processing?:{status}}
   GET  /upload/status/:id      -> {state:'UPLOADING'|'PROCESSING'|'READY'|'FAILED', offset?, progress?,
                                    driveFileId?, playbackFileId?, playbackUrl?, thumbnailFileId?, thumbnailUrl?,
                                    variants?:[{label,fileId,url,width,height,size}], width?, height?, duration?,
                                    playbackSize?, error?}
                                    404/410 = session expired
   GET  /manifest               -> {version:1, updatedAt, items:[], posts:[], users:[]}
   GET  /media/:fileId          -> media bytes (supports Range)
   GET  /download/:id/:quality  -> bytes with Content-Disposition (quality: original|1080p|720p|...)
   POST /posts                  {post}  -> {post}
   POST /publish                {item}  -> {item}  (server decides moderationStatus)
   POST /report                 {report} -> {ok:true}
   Errors: JSON {error:{code,message}}; 401 auth expired, 403 denied/quota, 404 missing, 429 rate, 5xx retryable.

   GOOGLE DRIVE DIRECT: browser OAuth (Google Identity Services token model, no secret),
   resumable upload protocol (session URI + PUT Content-Range chunks, HTTP 308 handling).
   NOTE: with the narrow "drive.file" scope the app can only touch files/folders it created
   or the user opened with it; writing into an arbitrary pre-existing folder usually needs the
   broader "drive" scope (restricted by Google) or a trusted backend. The app reports
   permission errors literally instead of hiding them.

   STATIC-FILE LIMITS (honest): a client-only file cannot write to the owner's private Drive for
   anonymous visitors, cannot guarantee search-engine indexing of dynamic uploads and cannot
   share a database between users. Use CENTRAL_PRODUCTION with a backend for that.
   SPA routing needs a server rewrite of unknown paths to index.html (otherwise use hash mode).
   ===================================================================== */

/* ============================ CONFIGURATION ============================ */
const ZELUNI_CONFIG = {
  // --- Google (browser OAuth client ID only; NEVER put secrets here) ---
  googleClientId: "",
  googleDriveFolderId: "1Mgj0sBHn6qDwMrwaDDu9YwWHSbDxdpGJ",
  driveScope: "https://www.googleapis.com/auth/drive.file",
  drivePublicSharing: false,      // if true, uploaded files get "anyone with link: reader" on publish
  // --- Central backend (production) ---
  centralUploadEndpoint: "",      // e.g. https://api.example.com/zeluni
  publicManifestUrl: "",          // GET -> manifest JSON
  publicMediaBaseUrl: "",         // CDN base, files resolved as <base>/<fileId>
  // --- Site / SEO ---
  publicSiteUrl: "",              // PUBLIC_SITE_URL, e.g. https://zeluni.example
  sitemapEndpoint: "",            // SITEMAP_ENDPOINT (backend generated)
  logoUrl: "",                    // optional: URL of the supplied Zeluni logo image (overrides inline vector)
  basePath: "",                   // if served from a sub-path, e.g. "/app"
  routeMode: "auto",              // auto | history | hash
  // --- Modes ---
  storageMode: "auto",            // auto | LOCAL_DEVELOPMENT | GOOGLE_DRIVE_DIRECT | CENTRAL_PRODUCTION
  productionMode: false,          // true => local-development storage is refused
  localAutoApprove: true,         // LOCAL_DEVELOPMENT only: this device acts as its own moderator
  ageGate: true,                  // 18+ gate (self-declaration unless window.ZELUNI_HOOKS.verifyAge exists)
  debugMode: false,
  // --- Upload engine ---
  uploadChunkSize: 50 * 1024 * 1024,
  maxConcurrentUploads: 2,
  maxRetries: 6,
  maxVideoBytes: 8 * 1024 ** 3,
  maxImageBytes: 50 * 1024 ** 2,
  localMaxBytes: 256 * 1024 ** 2, // LOCAL_DEVELOPMENT keeps files in IndexedDB blobs; capped
  enableBrowserCompression: true,
  ffmpegMaxBytes: 256 * 1024 ** 2,// larger videos => "serverTranscodeRequired"
  ffmpegScriptUrl: "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js",
  ffmpegWorkerUrl: "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/814.ffmpeg.js",
  ffmpegCoreBase: "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.6/dist/umd",
  hlsScriptUrl: "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js",
  categories: ["General","Entertainment","Music","Gaming","Education","Sports","Travel","Art","Technology","Lifestyle","Other"],
  pageSize: 24
};
const CFG = Object.assign({}, ZELUNI_CONFIG);
const EDITABLE_CFG = ["googleClientId","googleDriveFolderId","driveScope","drivePublicSharing","centralUploadEndpoint","publicManifestUrl","publicMediaBaseUrl","publicSiteUrl","sitemapEndpoint","logoUrl","storageMode","productionMode","localAutoApprove","enableBrowserCompression","uploadChunkSize","maxConcurrentUploads","debugMode"];

/* ============================ UTILITIES ============================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clean = (s, max = 5000) => String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F]/g, "").trim().slice(0, max);
const sleep = (ms, signal) => new Promise((res, rej) => {
  if (signal?.aborted) return rej(new StorageError("ABORTED", "Aborted"));
  const t = setTimeout(res, ms);
  signal?.addEventListener("abort", () => { clearTimeout(t); rej(new StorageError("ABORTED", "Aborted")); }, { once: true });
});
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const uid = prefix => {
  const t = Date.now().toString(32).toUpperCase().padStart(9, "0");
  const r = crypto.getRandomValues(new Uint8Array(12));
  return `${prefix}_01${t}${Array.from(r, b => (b % 32).toString(32)).join("").toUpperCase()}`;
};
const fmtBytes = n => { if (!Number.isFinite(n)) return "—"; const u = ["B","KB","MB","GB","TB"]; let i = 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return `${n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)} ${u[i]}`; };
const fmtDur = s => { if (!Number.isFinite(s) || s < 0) return "0:00"; s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
const fmtEta = s => !Number.isFinite(s) || s <= 0 ? "—" : s < 60 ? `${Math.ceil(s)}s` : s < 3600 ? `${Math.floor(s / 60)}m ${Math.ceil(s % 60)}s` : `${Math.floor(s / 3600)}h ${Math.floor(s % 3600 / 60)}m`;
const fmtNum = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(n | 0);
const ago = ts => {
  if (!ts) return ""; const d = (Date.now() - new Date(ts).getTime()) / 1000;
  const u = [[31536000, "year"], [2592000, "month"], [604800, "week"], [86400, "day"], [3600, "hour"], [60, "minute"]];
  for (const [s, n] of u) if (d >= s) { const v = Math.floor(d / s); return `${v} ${n}${v > 1 ? "s" : ""} ago`; }
  return "just now";
};
const slugify = s => clean(s, 120).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-+|-+$/g, "").slice(0, 60) || "untitled";
const safeUrl = u => { try { const x = new URL(u, location.href); return ["https:", "http:", "blob:"].includes(x.protocol) ? x.href : ""; } catch { return ""; } };
const initial = s => (clean(s, 40).match(/\p{L}|\p{N}/u) || ["?"])[0].toUpperCase();
const ic = (n, c = "") => `<svg class="ic ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const normEndpoint = u => { u = clean(u, 400); return u ? u.replace(/\/+$/, "") : ""; };

const Log = {
  ring: [],
  push(level, tag, a) { this.ring.push({ t: Date.now(), level, tag, msg: a.map(x => x instanceof Error ? x.message : typeof x === "string" ? x : JSON.stringify(x)).join(" ") }); if (this.ring.length > 200) this.ring.shift(); },
  log(tag, ...a) { this.push("log", tag, a); if (CFG.debugMode) console.log(`[${tag}]`, ...a); },
  err(tag, ...a) { this.push("error", "ERROR", a); console.error(`[${tag}]`, ...a); }
};

class Emitter {
  constructor() { this.h = {}; }
  on(e, f) { (this.h[e] ||= new Set()).add(f); return () => this.h[e].delete(f); }
  emit(e, d) { (this.h[e] || []).forEach(f => { try { f(d); } catch (x) { Log.err("EMIT", e, x); } }); }
}
const Bus = new Emitter();

class StorageError extends Error {
  constructor(code, message, extra) { super(message); this.name = "StorageError"; this.code = code; Object.assign(this, extra || {}); }
  get retryable() { return ["NETWORK", "RATE_LIMIT", "SERVER"].includes(this.code); }
}

/* ============================ IndexedDBStore ============================ */
class IndexedDBStore {
  static STORES = { kv: null, uploads: "id", blobs: null, items: "id", posts: "id", users: "id", follows: "key", likes: "key", reports: "id", notifications: "id", history: "id", stats: "id", analytics: "id", appeals: "id" };
  constructor() { this.db = null; this.mem = new Map(); this.available = false; this.error = ""; }
  async open() {
    if (!("indexedDB" in window)) return this._fallback("IndexedDB is not supported in this browser");
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("zeluni", 1);
        r.onupgradeneeded = () => { const d = r.result; for (const [n, k] of Object.entries(IndexedDBStore.STORES)) if (!d.objectStoreNames.contains(n)) d.createObjectStore(n, k ? { keyPath: k } : undefined); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error("IndexedDB blocked by another tab"));
      });
      this.db.onversionchange = () => this.db.close();
      this.available = true;
    } catch (e) { this._fallback(e.message); }
  }
  _fallback(msg) { this.db = null; this.available = false; this.error = msg; for (const n of Object.keys(IndexedDBStore.STORES)) this.mem.set(n, new Map()); Log.err("IDB", msg); }
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const r = fn(tx.objectStore(store));
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("Transaction aborted"));
    });
  }
  get(s, k) { return this.db ? this._req(s, "readonly", o => o.get(k)) : Promise.resolve(this.mem.get(s).get(k)); }
  put(s, v, k) {
    const kp = IndexedDBStore.STORES[s];
    if (!this.db) { this.mem.get(s).set(kp ? v[kp] : k, v); return Promise.resolve(); }
    return this._req(s, "readwrite", o => kp ? o.put(v) : o.put(v, k));
  }
  del(s, k) { return this.db ? this._req(s, "readwrite", o => o.delete(k)) : (this.mem.get(s).delete(k), Promise.resolve()); }
  all(s) { return this.db ? this._req(s, "readonly", o => o.getAll()).then(r => r || []) : Promise.resolve([...this.mem.get(s).values()]); }
  keys(s) { return this.db ? this._req(s, "readonly", o => o.getAllKeys()).then(r => r || []) : Promise.resolve([...this.mem.get(s).keys()]); }
  async clearAll() { if (!this.db) { for (const m of this.mem.values()) m.clear(); return; } for (const n of Object.keys(IndexedDBStore.STORES)) await this._req(n, "readwrite", o => o.clear()); }
}
const db = new IndexedDBStore();

async function loadConfigOverrides() {
  try { const o = await db.get("kv", "config") || {}; for (const k of EDITABLE_CFG) if (k in o) CFG[k] = o[k]; } catch (e) { Log.err("CONFIG", e); }
  CFG.centralUploadEndpoint = normEndpoint(CFG.centralUploadEndpoint);
  Log.log("CONFIG", "loaded");
}
async function saveConfigOverrides(patch) {
  const cur = await db.get("kv", "config") || {};
  for (const k of EDITABLE_CFG) if (k in patch) cur[k] = patch[k];
  await db.put("kv", cur, "config");
  for (const k of EDITABLE_CFG) if (k in cur) CFG[k] = cur[k];
  CFG.centralUploadEndpoint = normEndpoint(CFG.centralUploadEndpoint);
}

/* ============================ Constants / Model ============================ */
const S = Object.freeze({ QUEUED: "QUEUED", PREPARING: "PREPARING", COMPRESSING: "COMPRESSING", UPLOAD_READY: "UPLOAD_READY", UPLOADING: "UPLOADING", PAUSED: "PAUSED", RECONNECTING: "RECONNECTING", UPLOADED: "UPLOADED", VERIFYING: "VERIFYING", PROCESSING: "PROCESSING", READY: "READY", PUBLISHING: "PUBLISHING", PUBLISHED: "PUBLISHED", FAILED: "FAILED", CANCELLED: "CANCELLED", REJECTED: "REJECTED" });
const MOD = Object.freeze({ PENDING: "PENDING", APPROVED: "APPROVED", REJECTED: "REJECTED", QUARANTINED: "QUARANTINED", REMOVED: "REMOVED" });
const MODE = Object.freeze({ LOCAL: "LOCAL_DEVELOPMENT", DRIVE: "GOOGLE_DRIVE_DIRECT", CENTRAL: "CENTRAL_PRODUCTION" });
const VIS = ["public", "unlisted", "private"];

const Model = {
  str: (v, m) => clean(v, m),
  num: v => Number.isFinite(+v) && +v >= 0 ? +v : 0,
  item(r) {
    if (!r || typeof r !== "object" || !/^[\w-]{6,80}$/.test(String(r.id || ""))) return null;
    const type = r.type === "image" ? "image" : r.type === "video" ? "video" : null; if (!type) return null;
    const urls = {}; for (const k of ["playback", "original", "thumbnail", "large", "medium"]) if (r.urls?.[k]) { const u = safeUrl(r.urls[k]); if (u) urls[k] = u; }
    return {
      id: r.id, ownerId: clean(r.ownerId, 80), type, title: clean(r.title, 150) || "Untitled", description: clean(r.description, 5000),
      tags: Array.isArray(r.tags) ? r.tags.map(t => clean(t, 32).toLowerCase()).filter(Boolean).slice(0, 15) : [], category: clean(r.category, 40) || "General",
      filename: clean(r.filename, 200), mimeType: clean(r.mimeType, 100), originalSize: Model.num(r.originalSize), playbackSize: Model.num(r.playbackSize),
      width: Model.num(r.width), height: Model.num(r.height), duration: Model.num(r.duration),
      thumbnailFileId: clean(r.thumbnailFileId, 200), originalFileId: clean(r.originalFileId, 200), playbackFileId: clean(r.playbackFileId, 200), driveFileId: clean(r.driveFileId, 200),
      imageFileIds: r.imageFileIds && typeof r.imageFileIds === "object" ? { large: clean(r.imageFileIds.large, 200), medium: clean(r.imageFileIds.medium, 200), thumbnail: clean(r.imageFileIds.thumbnail, 200) } : {},
      variants: Array.isArray(r.variants) ? r.variants.slice(0, 8).map(v => ({ label: clean(v.label, 20), fileId: clean(v.fileId, 200), url: safeUrl(v.url || ""), width: Model.num(v.width), height: Model.num(v.height), size: Model.num(v.size) })) : [],
      captions: Array.isArray(r.captions) ? r.captions.slice(0, 6).map(c => ({ lang: clean(c.lang, 10), label: clean(c.label, 30), url: safeUrl(c.url || "") })).filter(c => c.url) : [],
      urls, visibility: VIS.includes(r.visibility) ? r.visibility : "public", downloadEnabled: !!r.downloadEnabled, ageRestricted: r.ageRestricted !== false,
      processingStatus: clean(r.processingStatus, 40), moderationStatus: Object.values(MOD).includes(r.moderationStatus) ? r.moderationStatus : MOD.PENDING,
      moderation: { notes: Array.isArray(r.moderation?.notes) ? r.moderation.notes.slice(-20).map(n => ({ at: clean(n.at, 40), by: clean(n.by, 60), text: clean(n.text, 500) })) : [], appeals: Array.isArray(r.moderation?.appeals) ? r.moderation.appeals.slice(-5) : [] },
      createdAt: clean(r.createdAt, 40), publishedAt: clean(r.publishedAt, 40), storage: ["local", "drive", "central"].includes(r.storage) ? r.storage : "central",
      postId: clean(r.postId, 80), checksum: clean(r.checksum, 100), stats: { views: Model.num(r.stats?.views), likes: Model.num(r.stats?.likes) }
    };
  },
  post(r) {
    if (!r || typeof r !== "object" || !/^[\w-]{6,80}$/.test(String(r.id || ""))) return null;
    return { id: r.id, authorId: clean(r.authorId, 80), body: clean(r.body, 10000), assets: Array.isArray(r.assets) ? r.assets.map(a => clean(a, 80)).filter(Boolean).slice(0, 40) : [], type: ["TEXT", "IMAGE", "VIDEO", "MIXED"].includes(r.type) ? r.type : "TEXT", visibility: VIS.includes(r.visibility) ? r.visibility : "public", moderationStatus: Object.values(MOD).includes(r.moderationStatus) ? r.moderationStatus : MOD.PENDING, createdAt: clean(r.createdAt, 40), updatedAt: clean(r.updatedAt, 40), storage: ["local", "drive", "central"].includes(r.storage) ? r.storage : "central" };
  },
  user(r) {
    if (!r || typeof r !== "object" || !/^[\w-]{6,80}$/.test(String(r.id || ""))) return null;
    const un = clean(r.username, 24).toLowerCase(); if (!/^[a-z0-9_.]{3,24}$/.test(un)) return null;
    return { id: r.id, username: un, displayName: clean(r.displayName, 50) || un, bio: clean(r.bio, 500), avatarUrl: safeUrl(r.avatarUrl || ""), coverUrl: safeUrl(r.coverUrl || ""), createdAt: clean(r.createdAt, 40), stats: { followers: r.stats?.followers == null ? null : Model.num(r.stats.followers), following: r.stats?.following == null ? null : Model.num(r.stats.following) } };
  }
};

/* ============================ HTTP HELPERS ============================ */
function classifyHttp(res, ctx) {
  const { status } = res; let reason = "", msg = "";
  try { const j = JSON.parse(res.text || "{}"); reason = j?.error?.errors?.[0]?.reason || j?.error?.code || ""; msg = j?.error?.message || j?.message || ""; } catch { /* non-JSON body */ }
  msg = msg || `HTTP ${status}`;
  const ra = parseInt(res.getHeader?.("Retry-After") || "", 10); const extra = { status, retryAfter: Number.isFinite(ra) ? ra : 0 };
  if (status === 401) return new StorageError("AUTH_EXPIRED", "Authentication expired — reconnect and retry", extra);
  if (status === 403) {
    if (/ratelimit/i.test(reason)) return new StorageError("RATE_LIMIT", "Rate limit reached — slowing down", extra);
    if (/quota/i.test(reason + msg)) return new StorageError("QUOTA", "Storage quota exceeded: " + msg, extra);
    return new StorageError("PERMISSION_DENIED", "Permission denied: " + msg, extra);
  }
  if (status === 404 || status === 410) return new StorageError(ctx === "session" ? "SESSION_EXPIRED" : "NOT_FOUND", ctx === "session" ? "Upload session expired" : "Not found: " + msg, extra);
  if (status === 408 || status === 429) return new StorageError("RATE_LIMIT", "Server asked us to slow down (" + status + ")", extra);
  if (status === 413) return new StorageError("FILE_TOO_LARGE", "File too large for storage: " + msg, extra);
  if (status >= 500) return new StorageError("SERVER", "Storage service error (" + status + ")", extra);
  return new StorageError("BAD_REQUEST", msg, extra);
}
function xhrSend({ method, url, headers = {}, body = null, signal, onProgress }) {
  return new Promise((resolve, reject) => {
    if (signal?.aborted) return reject(new StorageError("ABORTED", "Aborted"));
    const x = new XMLHttpRequest(); x.open(method, url, true);
    for (const [k, v] of Object.entries(headers)) x.setRequestHeader(k, v);
    if (x.upload && onProgress) x.upload.onprogress = e => { if (e.lengthComputable) onProgress(e.loaded); };
    x.onload = () => { cleanup(); resolve({ status: x.status, text: x.responseText, getHeader: n => x.getResponseHeader(n) }); };
    x.onerror = () => { cleanup(); reject(new StorageError("NETWORK", "Network error")); };
    x.ontimeout = () => { cleanup(); reject(new StorageError("NETWORK", "Request timed out")); };
    x.onabort = () => { cleanup(); reject(new StorageError("ABORTED", "Aborted")); };
    const onAbort = () => x.abort(); signal?.addEventListener("abort", onAbort, { once: true });
    function cleanup() { signal?.removeEventListener("abort", onAbort); }
    x.send(body);
  });
}
async function fetchJson(url, { method = "GET", headers = {}, body, signal, ctx, timeout = 30000, raw = false } = {}) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(new Error("timeout")), timeout);
  const onAbort = () => ctl.abort(); signal?.addEventListener("abort", onAbort, { once: true });
  let r;
  try { r = await fetch(url, { method, headers, body, signal: ctl.signal, cache: "no-store" }); }
  catch (e) { if (signal?.aborted) throw new StorageError("ABORTED", "Aborted"); throw new StorageError("NETWORK", ctl.signal.aborted ? "Request timed out" : "Network error — " + (e.message || "request failed")); }
  finally { clearTimeout(t); signal?.removeEventListener("abort", onAbort); }
  const text = await r.text().catch(() => "");
  if (!r.ok) throw classifyHttp({ status: r.status, text, getHeader: n => r.headers.get(n) }, ctx);
  if (raw) return text;
  if (!text) return {};
  try { return JSON.parse(text); } catch { throw new StorageError("SERVER", "Server returned invalid JSON"); }
}
const loadScript = (url) => new Promise((res, rej) => {
  if ($(`script[data-src="${url}"]`)) { const s = $(`script[data-src="${url}"]`); if (s.dataset.done) return res(); s.addEventListener("load", res); s.addEventListener("error", () => rej(new Error("Failed to load " + url))); return; }
  const s = document.createElement("script"); s.src = url; s.async = true; s.dataset.src = url;
  s.onload = () => { s.dataset.done = "1"; res(); }; s.onerror = () => { s.remove(); rej(new Error("Failed to load " + url)); }; document.head.appendChild(s);
});
const backoff = n => Math.min(60000, 1000 * 2 ** (n - 1)) * (0.6 + Math.random() * 0.4);
const EXT = { "video/mp4": "mp4", "video/quicktime": "mov", "video/webm": "webm", "video/x-matroska": "mkv", "image/jpeg": "jpg", "image/png": "png", "image/webp": "webp", "image/gif": "gif" };

/* ============================ AUTH ============================ */
class GoogleAuth extends Emitter {
  constructor() { super(); this.state = "disconnected"; this.error = ""; this.token = null; this.expiresAt = 0; this.client = null; }
  get configured() { return !!CFG.googleClientId; }
  get connected() { return !!this.token && Date.now() < this.expiresAt - 30000; }
  setState(s, err = "") { this.state = s; this.error = err; Log.log("AUTH", s, err); this.emit("state", this); Bus.emit("google", this); }
  async loadGis() { if (window.google?.accounts?.oauth2) return; try { await loadScript("https://accounts.google.com/gsi/client"); } catch { throw new StorageError("NETWORK", "Could not load Google Identity Services"); } }
  async connect({ prompt } = {}) {
    if (!this.configured) throw new StorageError("NOT_CONFIGURED", "Google OAuth client ID is not configured");
    this.setState("connecting");
    try { await this.loadGis(); } catch (e) { this.setState("error", e.message); throw e; }
    return new Promise((resolve, reject) => {
      const scope = CFG.driveScope;
      this.client = google.accounts.oauth2.initTokenClient({
        client_id: CFG.googleClientId, scope,
        callback: resp => {
          if (resp.error) { const denied = resp.error === "access_denied"; this.setState(denied ? "denied" : "error", resp.error_description || resp.error); return reject(new StorageError(denied ? "PERMISSION_DENIED" : "AUTH_EXPIRED", denied ? "Google Drive permission was denied" : "Authorization error: " + resp.error)); }
          if (!google.accounts.oauth2.hasGrantedAllScopes(resp, scope)) { this.setState("denied", "Required Drive permission not granted"); return reject(new StorageError("PERMISSION_DENIED", "Required Drive permission was not granted")); }
          this.token = resp.access_token; this.expiresAt = Date.now() + (+resp.expires_in || 3600) * 1000; this.setState("connected"); resolve(this.token);
        },
        error_callback: e => { const m = e.type === "popup_closed" ? "Authorization window was closed" : e.type === "popup_failed_to_open" ? "Popup blocked — allow popups and retry" : String(e.message || e.type); this.setState("error", m); reject(new StorageError("AUTH_EXPIRED", m)); }
      });
      this.client.requestAccessToken({ prompt: prompt ?? (this.token ? "" : "consent") });
    });
  }
  async getToken() {
    if (this.connected) return this.token;
    if (!this.configured) throw new StorageError("NOT_CONFIGURED", "Google Drive is not configured");
    if (this.token) this.setState("expired", "Access token expired");
    try { return await this.connect({ prompt: "" }); }
    catch (e) { if (this.state !== "denied") this.setState("expired", "Authorization expired — reconnect Google Drive"); throw new StorageError("AUTH_EXPIRED", "Google authorization expired — reconnect Google Drive"); }
  }
  disconnect() { try { if (this.token && window.google?.accounts?.oauth2) google.accounts.oauth2.revoke(this.token, () => {}); } catch { /* ignore */ } this.token = null; this.expiresAt = 0; this.setState("disconnected"); }
}

class AuthManager extends Emitter {
  constructor() { super(); this.user = null; this.google = new GoogleAuth(); }
  async init() { const id = await db.get("kv", "session.userId"); this.user = id ? (await db.get("users", id)) || null : null; }
  profiles() { return db.all("users"); }
  async create({ username, displayName, bio, avatar, cover }) {
    username = clean(username, 24).toLowerCase().replace(/^@/, "");
    if (!/^[a-z0-9_.]{3,24}$/.test(username)) throw new Error("Username must be 3–24 characters: a–z, 0–9, _ or .");
    if ((await this.profiles()).some(u => u.username === username) || App.manifest.userByName(username)) throw new Error("That username is already taken");
    const user = { id: uid("user"), username, displayName: clean(displayName, 50) || username, bio: clean(bio, 500), createdAt: new Date().toISOString(), hasAvatar: false, hasCover: false };
    if (avatar) { await db.put("blobs", await MediaProcessor.resize(avatar, 256, 256, "image/jpeg", 0.85, true), "avatar:" + user.id); user.hasAvatar = true; }
    if (cover) { await db.put("blobs", await MediaProcessor.resize(cover, 1280, 720, "image/jpeg", 0.8, false), "cover:" + user.id); user.hasCover = true; }
    await db.put("users", user); await this.signIn(user.id); return user;
  }
  async update(patch) {
    const u = this.user; if (!u) throw new Error("Not signed in");
    u.displayName = clean(patch.displayName, 50) || u.username; u.bio = clean(patch.bio, 500);
    if (patch.avatar) { await db.put("blobs", await MediaProcessor.resize(patch.avatar, 256, 256, "image/jpeg", 0.85, true), "avatar:" + u.id); u.hasAvatar = true; Media.forget("avatar:" + u.id); }
    if (patch.cover) { await db.put("blobs", await MediaProcessor.resize(patch.cover, 1280, 720, "image/jpeg", 0.8, false), "cover:" + u.id); u.hasCover = true; Media.forget("cover:" + u.id); }
    await db.put("users", u); this.emit("change", u);
  }
  async signIn(id) { const u = await db.get("users", id); if (!u) throw new Error("Profile not found"); this.user = u; await db.put("kv", id, "session.userId"); this.emit("change", u); }
  async signOut() { this.user = null; await db.del("kv", "session.userId"); this.emit("change", null); }
}

/* ============================ STORAGE ADAPTERS ============================ */
class StorageAdapter {
  get mode() { return ""; }
  status() { return { ready: false, message: "Storage unavailable", tone: "bad" }; }
  async assertReady() { const s = this.status(); if (!s.ready) throw new StorageError("NOT_CONFIGURED", s.message); }
  async begin() { throw new StorageError("NOT_CONFIGURED", "Not implemented"); }
  async sendChunk() { throw new StorageError("NOT_CONFIGURED", "Not implemented"); }
  async queryOffset() { throw new StorageError("NOT_CONFIGURED", "Not implemented"); }
  async complete(task, result) { return result; }
  async verify() {}
  async processStatus() { return null; }
  async cancel() {}
  async publishItem(item) { return { item }; }
  async publishPost(post) { return { post }; }
  async report() { return { ok: false, reason: "Reports are stored on this device only" }; }
  async loadManifest() { return null; }
}

class LocalDevelopmentStorage extends StorageAdapter {
  get mode() { return MODE.LOCAL; }
  status() {
    if (CFG.productionMode) return { ready: false, message: "Production mode is on but no shared storage is configured", tone: "bad" };
    return { ready: true, message: "Local development mode — data is not shared between users.", tone: "warn" };
  }
  async begin(task) {
    if (task.rec.size > CFG.localMaxBytes) throw new StorageError("FILE_TOO_LARGE", `Local development storage is limited to ${fmtBytes(CFG.localMaxBytes)} per file. Configure Google Drive or a central endpoint for large files.`);
    return { sessionRef: "local:" + task.rec.id, offset: 0, chunkSize: Math.max(task.rec.size, 1) };
  }
  async sendChunk(task, start, end, blob, signal, onProgress) {
    if (signal.aborted) throw new StorageError("ABORTED", "Aborted");
    try { await db.put("blobs", task.file, "asset:" + task.rec.id); } catch (e) { throw new StorageError("QUOTA", "Browser storage refused the file: " + e.message); }
    onProgress(blob.size);
    return { offset: task.rec.size, done: true, result: { driveFileId: task.rec.id, size: task.rec.size } };
  }
  async queryOffset(task) { const b = await db.get("blobs", "asset:" + task.rec.id); return b ? { offset: task.rec.size, done: true, result: { driveFileId: task.rec.id, size: b.size } } : { offset: 0, done: false }; }
  async verify(task) { const b = await db.get("blobs", "asset:" + task.rec.id); if (!b || b.size !== task.rec.size) throw new StorageError("SERVER", "Stored copy is missing or has a different size"); }
  async cancel(task) { await db.del("blobs", "asset:" + task.rec.id); }
  async publishItem(item) { return { item }; }
}

class GoogleDriveStorage extends StorageAdapter {
  constructor() { super(); this.folders = {}; }
  get mode() { return MODE.DRIVE; }
  status() {
    if (!CFG.googleClientId) return { ready: false, message: "Google Drive is not configured", tone: "bad" };
    if (!CFG.googleDriveFolderId) return { ready: false, message: "Google Drive folder ID is not configured", tone: "bad" };
    if (!App.auth.google.connected) return { ready: false, message: "Connect Google Drive to upload", tone: "warn", action: "connect" };
    return { ready: true, message: "Google Drive direct mode — uploads go to the folder you authorized.", tone: "ok" };
  }
  async api(path, { method = "GET", params, json, signal } = {}) {
    const token = await App.auth.google.getToken();
    return fetchJson(`https://www.googleapis.com/drive/v3/${path}${params ? "?" + new URLSearchParams(params) : ""}`, { method, signal, headers: { Authorization: `Bearer ${token}`, ...(json ? { "Content-Type": "application/json" } : {}) }, body: json ? JSON.stringify(json) : undefined });
  }
  async folderFor(role, kind) {
    const name = role === "original" ? (kind === "image" ? "images" : "originals") : ({ playback: "playback", thumbnail: "thumbnails", image_large: "images", image_medium: "images", image_thumb: "images", manifest: "manifests", post: "posts" }[role] || "originals");
    const root = CFG.googleDriveFolderId, key = root + "/" + name;
    if (!this.folders[key]) { const c = await db.get("kv", "driveFolders"); if (c) Object.assign(this.folders, c); }
    if (this.folders[key]) return this.folders[key];
    const q = `name='${name}' and '${root}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`;
    const r = await this.api("files", { params: { q, fields: "files(id,name)", supportsAllDrives: "true", includeItemsFromAllDrives: "true" } });
    let id = r.files?.[0]?.id;
    if (!id) id = (await this.api("files", { method: "POST", params: { supportsAllDrives: "true", fields: "id" }, json: { name, mimeType: "application/vnd.google-apps.folder", parents: [root] } })).id;
    this.folders[key] = id; await db.put("kv", this.folders, "driveFolders"); return id;
  }
  async begin(task) {
    const rec = task.rec, token = await App.auth.google.getToken();
    const parent = await this.folderFor(rec.role, rec.kind);
    const res = await xhrSend({
      method: "POST", url: "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&supportsAllDrives=true&fields=id,name,size,md5Checksum",
      headers: { Authorization: "Bearer " + token, "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": rec.mime, "X-Upload-Content-Length": String(rec.size) },
      body: JSON.stringify({ name: `${rec.id}.${EXT[rec.mime] || "bin"}`, parents: [parent], mimeType: rec.mime, appProperties: { zeluniAsset: rec.id, role: rec.role } })
    });
    if (res.status !== 200) throw classifyHttp(res);
    const loc = res.getHeader("Location"); if (!loc) throw new StorageError("SERVER", "Drive did not return a resumable session URI");
    const chunk = Math.max(262144, Math.floor(CFG.uploadChunkSize / 262144) * 262144);
    return { sessionRef: loc, offset: 0, chunkSize: chunk };
  }
  parseRange(res) { const r = res.getHeader("Range"); if (!r) return 0; const m = /bytes=0-(\d+)/.exec(r); return m ? +m[1] + 1 : 0; }
  done(res) { let j = {}; try { j = JSON.parse(res.text || "{}"); } catch { /* empty */ } return { driveFileId: j.id, size: +j.size || 0, md5: j.md5Checksum }; }
  async sendChunk(task, start, end, blob, signal, onProgress) {
    const total = task.rec.size;
    const res = await xhrSend({ method: "PUT", url: task.rec.sessionRef, headers: { "Content-Range": `bytes ${start}-${end - 1}/${total}` }, body: blob, signal, onProgress });
    if (res.status === 308) return { offset: this.parseRange(res), done: false };
    if (res.status === 200 || res.status === 201) return { offset: total, done: true, result: this.done(res) };
    throw classifyHttp(res, "session");
  }
  async queryOffset(task) {
    const total = task.rec.size;
    const res = await xhrSend({ method: "PUT", url: task.rec.sessionRef, headers: { "Content-Range": `bytes */${total}` }, body: null });
    if (res.status === 308) return { offset: this.parseRange(res), done: false };
    if (res.status === 200 || res.status === 201) return { offset: total, done: true, result: this.done(res) };
    throw classifyHttp(res, "session");
  }
  async verify(task) {
    const id = task.rec.driveFileId; if (!id) throw new StorageError("SERVER", "Drive did not return a file ID");
    const f = await this.api(`files/${encodeURIComponent(id)}`, { params: { fields: "id,size,trashed", supportsAllDrives: "true" } });
    if (f.trashed) throw new StorageError("SERVER", "File is in the Drive trash");
    if (+f.size !== task.rec.size) throw new StorageError("SERVER", `Drive reports ${f.size} bytes, expected ${task.rec.size}`);
  }
  async cancel(task) { const u = task.rec.sessionRef; if (u && /^https:/.test(u) && !task.rec.driveFileId) { try { await xhrSend({ method: "DELETE", url: u }); } catch { /* best effort */ } } }
  async publishItem(item) {
    const token = await App.auth.google.getToken(), parent = await this.folderFor("manifest"), b = "zeluni" + Date.now();
    const body = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify({ name: item.id + ".json", parents: [parent], mimeType: "application/json" })}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(item)}\r\n--${b}--`;
    const res = await xhrSend({ method: "POST", url: "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id&supportsAllDrives=true", headers: { Authorization: "Bearer " + token, "Content-Type": `multipart/related; boundary=${b}` }, body });
    if (res.status !== 200) throw classifyHttp(res);
    if (CFG.drivePublicSharing) for (const id of [item.originalFileId, item.playbackFileId, item.thumbnailFileId, ...Object.values(item.imageFileIds || {})].filter(Boolean)) await this.api(`files/${encodeURIComponent(id)}/permissions`, { method: "POST", params: { supportsAllDrives: "true" }, json: { role: "reader", type: "anyone" } });
    return { item, manifestFileId: JSON.parse(res.text).id };
  }
}

class CentralUploadStorage extends StorageAdapter {
  get mode() { return MODE.CENTRAL; }
  get ep() { return CFG.centralUploadEndpoint; }
  status() {
    if (!this.ep) return { ready: false, message: "Central storage endpoint not configured", tone: "bad" };
    if (!/^https:\/\/|^http:\/\/localhost|^http:\/\/127\./.test(this.ep)) return { ready: false, message: "Central endpoint must use HTTPS", tone: "bad" };
    return { ready: true, message: "Central production storage", tone: "ok" };
  }
  hdrs(extra = {}) { const h = { "X-Zeluni-User": App.auth.user?.id || "", ...extra }; if (App.auth.google.connected) h.Authorization = "Bearer " + App.auth.google.token; return h; }
  call(path, { method = "GET", json, signal, ctx } = {}) { return fetchJson(this.ep + path, { method, signal, ctx, headers: this.hdrs(json ? { "Content-Type": "application/json" } : {}), body: json ? JSON.stringify(json) : undefined }); }
  async begin(task) {
    const r = task.rec, j = await this.call("/upload/init", { method: "POST", json: { uploadId: r.id, role: r.role, filename: r.filename, size: r.size, mime: r.mime, checksum: r.fingerprint?.value || "", kind: r.kind, groupId: r.groupId || "" } });
    if (!j.uploadSessionId) throw new StorageError("SERVER", "Endpoint did not return uploadSessionId");
    return { sessionRef: String(j.uploadSessionId), offset: +j.offset || 0, chunkSize: +j.chunkSize > 0 ? +j.chunkSize : CFG.uploadChunkSize };
  }
  async sendChunk(task, start, end, blob, signal, onProgress) {
    const res = await xhrSend({ method: "POST", url: this.ep + "/upload/chunk", headers: this.hdrs({ "X-Upload-Id": task.rec.sessionRef, "Content-Range": `bytes ${start}-${end - 1}/${task.rec.size}`, "Content-Type": "application/octet-stream" }), body: blob, signal, onProgress });
    if (res.status < 200 || res.status > 299) throw classifyHttp(res, "session");
    let j = {}; try { j = JSON.parse(res.text || "{}"); } catch { throw new StorageError("SERVER", "Endpoint returned invalid chunk response"); }
    if (!Number.isFinite(+j.offset)) throw new StorageError("SERVER", "Endpoint chunk response lacks offset");
    return { offset: +j.offset, done: !!j.done || +j.offset >= task.rec.size, result: j.result };
  }
  async queryOffset(task) {
    const j = await this.call(`/upload/status/${encodeURIComponent(task.rec.sessionRef)}`, { ctx: "session" });
    const off = +j.offset || 0; return { offset: off, done: off >= task.rec.size && !!j.driveFileId, result: j.driveFileId ? { driveFileId: j.driveFileId, size: task.rec.size } : undefined };
  }
  async complete(task, result) {
    const j = await this.call("/upload/complete", { method: "POST", json: { uploadSessionId: task.rec.sessionRef, uploadId: task.rec.id } });
    return { ...result, ...j, driveFileId: j.driveFileId || result?.driveFileId };
  }
  async verify(task) { const s = task.rec.result?.size; if (s && s !== task.rec.size) throw new StorageError("SERVER", `Server stored ${s} bytes, expected ${task.rec.size}`); if (!task.rec.driveFileId) throw new StorageError("SERVER", "Endpoint did not confirm a file ID"); }
  async processStatus(task, signal) { return this.call(`/upload/status/${encodeURIComponent(task.rec.sessionRef)}`, { signal, ctx: "session" }); }
  async publishItem(item) { const j = await this.call("/publish", { method: "POST", json: { item } }); return { item: j.item || item }; }
  async publishPost(post) { const j = await this.call("/posts", { method: "POST", json: { post } }); return { post: j.post || post }; }
  async report(report) { await this.call("/report", { method: "POST", json: { report } }); return { ok: true }; }
  async loadManifest(signal) { return fetchJson(CFG.publicManifestUrl || this.ep + "/manifest", { signal, headers: { Accept: "application/json" } }); }
}

/* ============================ MEDIA DELIVERY (separate from storage) ============================ */
class LocalMediaDelivery { async resolve(fileId) { const k = "asset:" + fileId; if (Media.urls.has(k)) return Media.urls.get(k); const b = await db.get("blobs", k); if (!b) return ""; const u = URL.createObjectURL(b); Media.urls.set(k, u); return u; } }
class DriveMediaDelivery { async resolve(fileId, kind) { const id = encodeURIComponent(fileId); return kind === "thumbnail" || kind === "medium" ? `https://drive.google.com/thumbnail?id=${id}&sz=w${kind === "medium" ? 800 : 640}` : `https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t`; } }
class CentralMediaDelivery { async resolve(fileId) { return `${CFG.centralUploadEndpoint}/media/${encodeURIComponent(fileId)}`; } }
class CDNMediaDelivery { async resolve(fileId) { return `${CFG.publicMediaBaseUrl.replace(/\/+$/, "")}/${encodeURIComponent(fileId)}`; } } // future: S3/R2 + CDN
const Media = {
  urls: new Map(),
  forget(key) { const u = this.urls.get(key); if (u?.startsWith("blob:")) URL.revokeObjectURL(u); this.urls.delete(key); },
  revokeAll() { for (const u of this.urls.values()) if (u.startsWith("blob:")) URL.revokeObjectURL(u); this.urls.clear(); },
  fileIdFor(item, kind) {
    const ids = item.imageFileIds || {};
    switch (kind) {
      case "playback": return item.playbackFileId || item.originalFileId || item.driveFileId;
      case "original": return item.originalFileId || item.driveFileId;
      case "thumbnail": return item.type === "image" ? ids.thumbnail || item.thumbnailFileId : item.thumbnailFileId;
      case "large": return ids.large || item.originalFileId || item.driveFileId;
      case "medium": return ids.medium || ids.large || item.originalFileId || item.driveFileId;
      default: return "";
    }
  },
  async url(item, kind) {
    if (item.urls?.[kind]) return item.urls[kind];
    const id = this.fileIdFor(item, kind); if (!id) return "";
    return this.byFile(item.storage, id, kind);
  },
  async byFile(storage, id, kind) {
    if (storage === "local") return new LocalMediaDelivery().resolve(id);
    if (CFG.publicMediaBaseUrl) return new CDNMediaDelivery().resolve(id);
    if (storage === "drive") return new DriveMediaDelivery().resolve(id, kind);
    return new CentralMediaDelivery().resolve(id);
  },
  async avatar(userId, which) {
    const k = which + ":" + userId; if (this.urls.has(k)) return this.urls.get(k);
    const b = await db.get("blobs", k); if (!b) return ""; const u = URL.createObjectURL(b); this.urls.set(k, u); return u;
  }
};

/* ============================ MEDIA PROCESSING ============================ */
const MediaProcessor = {
  async validate(file) {
    const ext = (file.name.split(".").pop() || "").toLowerCase();
    const b = new Uint8Array(await file.slice(0, 32).arrayBuffer());

      if (needsFile && !t.file) {
        t.rec.needFile = true; t.rec.state = S.PAUSED; t.rec.error = "Select file again to continue";
        await this.recoverFromHandle(t, false);
      } else t.rec.state = S.QUEUED;
    }
    this.emit("restored"); this.pump();
  }
  async recoverFromHandle(t, gesture) {
    const h = await db.get("blobs", "handle:" + t.id).catch(() => null); if (!h) return false;
    try {
      let p = await h.queryPermission({ mode: "read" }); if (p !== "granted" && gesture) p = await h.requestPermission({ mode: "read" });
      if (p !== "granted") return false;
      return await this.attachFile(t, await h.getFile());
    } catch (e) { Log.log("UPLOAD", "handle recovery failed", e.message); return false; }
  }
  async attachFile(t, file) {
    const r = t.rec;
    if (file.size !== r.size || file.lastModified !== r.lastModified || file.name !== r.filename) throw new Error("That file does not match the interrupted upload (name, size or modified date differs)");
    if (r.fingerprint) { const fp = await MediaProcessor.fingerprint(file); if (fp.value !== r.fingerprint.value) throw new Error("File content differs from the original upload"); }
    t.file = file; r.needFile = false; r.error = ""; t.resume(); this.emit("task", t); return true;
  }
  async addFiles(files, opts = {}) {
    const out = [];
    for (const f of files) {
      const rec = { id: uid("asset"), role: "original", groupId: opts.groupId || "", purpose: opts.purpose || "video", filename: clean(f.name, 200), size: f.size, lastModified: f.lastModified, mime: f.type, kind: "", state: S.QUEUED, stage: "prepare", created: Date.now(), retryCount: 0, offset: 0, hidden: false, children: [], error: "" };
      const t = new UploadTask(this, rec, f); this.tasks.set(rec.id, t);
      if (opts.handles?.get(f)) await db.put("blobs", opts.handles.get(f), "handle:" + rec.id).catch(() => {});
      this.persist(t); out.push(t); this.emit("task", t);
    }
    this.pump(); return out;
  }
  async createDerived(parent, role, blob, filename, mime) {
    const rec = { id: uid("asset"), role, parentId: parent.id, groupId: parent.rec.groupId, kind: role === "playback" ? "video" : "image", filename, size: blob.size, lastModified: Date.now(), mime, state: S.QUEUED, stage: "upload", hidden: true, created: Date.now(), retryCount: 0, offset: 0, children: [], error: "" };
    await db.put("blobs", blob, "derived:" + rec.id);
    const t = new UploadTask(this, rec, blob); this.tasks.set(rec.id, t); (parent.rec.children ||= []).push({ id: rec.id, role });
    this.persist(t); this.persist(parent); this.pump(); return t;
  }
  async replaceThumbnail(parent, file) {
    const v = await MediaProcessor.validate(file); if (!v.ok || v.kind !== "image") throw new Error(v.error || "Thumbnail must be an image");
    const blob = await MediaProcessor.resize(file, 1280, 720, "image/jpeg", 0.85);
    const role = parent.rec.kind === "video" ? "thumbnail" : "image_thumb";
    for (const c of (parent.rec.children || []).filter(c => c.role === role)) this.tasks.get(c.id)?.cancel();
    parent.rec.children = (parent.rec.children || []).filter(c => c.role !== role);
    parent.thumbBlob = blob; return this.createDerived(parent, role, blob, "thumbnail.jpg", "image/jpeg");
  }
  async waitChildren(parent, sig) { while (!parent.settled) { this.emit("progress", parent); await sleep(400, sig); } const bad = (parent.rec.children || []).filter(c => this.tasks.get(c.id)?.state === S.FAILED); if (bad.length) parent.rec.warning = `Some generated files failed to upload (${bad.map(c => c.role).join(", ")}). Retry them or publish with what is available.`; }
  pump() {
    if (!navigator.onLine) return;
    let free = CFG.maxConcurrentUploads - [...this.tasks.values()].filter(t => t.running && t.slot).length;
    const q = [...this.tasks.values()].filter(t => t.state === S.QUEUED && !t.running).sort((a, b) => (a.rec.hidden ? 0 : 1) - (b.rec.hidden ? 0 : 1) || a.rec.created - b.rec.created);
    for (const t of q) { if (free <= 0) break; t.run(); free--; }
  }
  pauseAll(reason = "pause") { for (const t of this.tasks.values()) { if (t.running) { t.stop = reason; t.ctl?.abort(); } else if (t.state === S.QUEUED && reason === "pause") t.set(S.PAUSED); } }
  resumeAll() { for (const t of this.tasks.values()) if ([S.PAUSED, S.RECONNECTING].includes(t.state)) t.resume(); this.pump(); }
  retryAllFailed() { for (const t of this.tasks.values()) if (t.state === S.FAILED) t.retry(); }
  onOffline() { this.pauseAll("offline"); this.emit("net", false); }
  onOnline() { for (const t of this.tasks.values()) if (t.state === S.RECONNECTING && !(t.rec.needFile && !t.file)) t.resume(); this.pump(); this.emit("net", true); }
}

let App = null;
const timeIso = s => { s = Math.round(s || 0); return `PT${Math.floor(s / 3600)}H${Math.floor(s % 3600 / 60)}M${s % 60}S`; };

class NotificationManager extends Emitter {

class AnalyticsManager {
  constructor() { this.viewed = new Set(); this.prune = debounce(async () => { const k = (await db.keys("analytics")).sort(); if (k.length > 600) for (const id of k.slice(0, k.length - 500)) await db.del("analytics", id); }, 5000); }
  async track(item, name, data = {}) {
    const evt = { id: uid("evt"), itemId: item.id, name, data, ts: Date.now() }; Log.log("PLAYER", name, data);
    try { window.ZELUNI_HOOKS?.onAnalytics?.(evt); } catch { /* hook errors must not break playback */ }
    await db.put("analytics", evt).catch(() => {}); this.prune();
  }
  async bump(item, field) { if (!(App.mode === MODE.LOCAL || item.storage === "local")) return; const s = (await db.get("stats", item.id)) || { id: item.id, views: 0, completions: 0 }; s[field] = (s[field] || 0) + 1; await db.put("stats", s); App.manifest.stats.set(item.id, s); }

class ModerationManager {

class ManifestManager {
  constructor() { this.items = new Map(); this.posts = new Map(); this.localUsers = new Map(); this.remoteUsers = new Map(); this.stats = new Map(); this.followKeys = new Set(); this.likeKeys = new Set(); this.status = { state: "idle", error: "", updatedAt: "" }; }
  async load() {
    const [items, posts, users, stats, follows, likes] = await Promise.all(["items", "posts", "users", "stats", "follows", "likes"].map(s => db.all(s)));
    this.items = new Map(); this.posts = new Map(); this.remoteUsers = new Map(); this.localUsers = new Map(users.map(u => [u.id, u]));
    this.stats = new Map(stats.map(s => [s.id, s])); this.followKeys = new Set(follows.map(f => f.key)); this.likeKeys = new Set(likes.map(l => l.key));
    const url = CFG.publicManifestUrl || (App.mode === MODE.CENTRAL && CFG.centralUploadEndpoint ? CFG.centralUploadEndpoint + "/manifest" : "");
    this.status = { state: url ? "loading" : "local", error: "", updatedAt: "" };
    let remote = null;
    if (url) {
      try {
        remote = App.mode === MODE.CENTRAL ? await App.storage.loadManifest() : await fetchJson(url, { headers: { Accept: "application/json" } });
        if (!remote || remote.version !== 1 || !Array.isArray(remote.items)) throw new StorageError("SERVER", "Manifest has an unsupported format (expected {version:1, items:[]})");
        await db.put("kv", remote, "manifestCache"); this.status = { state: "ok", error: "", updatedAt: remote.updatedAt || "" };
      } catch (e) { Log.err("MANIFEST", e); remote = await db.get("kv", "manifestCache").catch(() => null); this.status = { state: remote ? "stale" : "error", error: e.message, updatedAt: remote?.updatedAt || "" }; }
    }
    if (remote) {
      for (const r of remote.items || []) { const i = Model.item(r); if (i) { i.remote = true; this.items.set(i.id, i); } }
      for (const r of remote.posts || []) { const p = Model.post(r); if (p) this.posts.set(p.id, p); }
      for (const r of remote.users || []) { const u = Model.user(r); if (u) this.remoteUsers.set(u.id, u); }
    }
    for (const r of items) { const i = Model.item(r); if (i && !this.items.has(i.id)) this.items.set(i.id, i); }
    for (const r of posts) { const p = Model.post(r); if (p && !this.posts.has(p.id)) this.posts.set(p.id, p); }
    Log.log("MEDIA", `manifest: ${this.items.size} items, ${this.posts.size} posts`); Bus.emit("manifest");
  }
  userById(id) { return this.localUsers.get(id) || this.remoteUsers.get(id) || null; }
  userByName(n) { n = String(n).toLowerCase(); for (const u of [...this.localUsers.values(), ...this.remoteUsers.values()]) if (u.username === n) return u; return null; }
  users() { return [...this.localUsers.values(), ...[...this.remoteUsers.values()].filter(u => !this.localUsers.has(u.id))]; }
  isOwn(x) { const me = App.auth.user?.id; return !!me && (x.ownerId === me || x.authorId === me); }
  listed(i) { return i.visibility === "public" && i.moderationStatus === MOD.APPROVED && !App.moderation.isBlocked(i.ownerId); }
  mine(i) { return this.isOwn(i) && i.moderationStatus !== MOD.REMOVED; }
  directlyViewable(i) { return this.isOwn(i) || (i.moderationStatus === MOD.APPROVED && i.visibility !== "private" && !App.moderation.isBlocked(i.ownerId)); }
  postListed(p) { return p.visibility === "public" && p.moderationStatus === MOD.APPROVED && !App.moderation.isBlocked(p.authorId); }
  findDuplicate(checksum) { for (const i of this.items.values()) if (i.checksum && i.checksum === checksum && i.moderationStatus !== MOD.REMOVED) return i; return null; }
  views(i) { return (i.stats.views || 0) + (this.stats.get(i.id)?.views || 0); }
  likes(i) { let n = i.stats.likes || 0; for (const k of this.likeKeys) if (k.endsWith(":" + i.id)) n++; return n; }
  followers(id) { const u = this.userById(id); if (u?.stats?.followers != null) return u.stats.followers; let n = 0; for (const k of this.followKeys) if (k.endsWith(">" + id)) n++; return n; }
  following(id) { let n = 0; for (const k of this.followKeys) if (k.startsWith(id + ">")) n++; return n; }
  isFollowing(t) { const me = App.auth.user?.id; return !!me && this.followKeys.has(`${me}>${t}`); }
  isLiked(id) { const me = App.auth.user?.id; return !!me && this.likeKeys.has(`${me}:${id}`); }
}
